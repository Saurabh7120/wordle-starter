services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-include '*.txt'
